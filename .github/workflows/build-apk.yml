name: Build NVP School Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install App Dependencies & Sync
        working-directory: ./app
        run: |
          npm ci || npm install
          npx cap sync android

      - name: Make Gradle Executable
        working-directory: ./app/android
        run: chmod +x gradlew

      - name: Generate Release Keystore
        working-directory: ./app/android/app
        run: |
          keytool -genkey -v -keystore nvp-release.jks -alias nvpkey -keyalg RSA -keysize 2048 -validity 10000 -storepass nvp2026pass -keypass nvp2026pass -dname "CN=NVP School, OU=School Management, O=NVP, L=Patna, S=Bihar, C=IN"

      - name: Build Signed Production Release APK
        working-directory: ./app/android
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: NVP_School_Official_Release_APK
          path: app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
