<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>NVP School Portal</title>
  <meta name="theme-color" content="#0f172a" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .logo-box {
      width: 90px;
      height: 90px;
      border-radius: 24px;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: 900;
      box-shadow: 0 20px 40px rgba(37, 99, 235, 0.35);
      margin-bottom: 24px;
      border: 3px solid rgba(255, 255, 255, 0.2);
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      max-width: 280px;
      line-height: 1.5;
    }
    .spinner {
      margin-top: 32px;
      width: 38px;
      height: 38px;
      border: 3.5px solid rgba(255, 255, 255, 0.15);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .offline-box {
      display: none;
      margin-top: 24px;
      padding: 16px;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 16px;
      max-width: 320px;
    }
    .retry-btn {
      margin-top: 16px;
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
    }
  </style>
</head>
<body>
  <div class="logo-box">🎓</div>
  <h1>NVP School</h1>
  <p>Connecting to School Management System...</p>
  
  <div class="spinner" id="spinner"></div>

  <div class="offline-box" id="offlineBox">
    <p style="color: #fca5a5; font-size: 13px;">Unable to reach live portal. Please check your internet connection and try again.</p>
    <button class="retry-btn" onclick="location.reload()">Retry Connection</button>
  </div>

  <script>
    // If offline fallback triggers
    window.addEventListener('offline', () => {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('offlineBox').style.display = 'block';
    });
    // Automatic retry every 10s if stuck
    setTimeout(() => {
      if (!window.navigator.onLine) {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('offlineBox').style.display = 'block';
      }
    }, 8000);
  </script>
</body>
</html>
